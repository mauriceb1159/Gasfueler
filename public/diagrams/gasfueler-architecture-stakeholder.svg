<svg width="1600" height="1000" viewBox="0 0 1600 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1600" y2="1000" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF7ED"/>
      <stop offset="0.5" stop-color="#FFFBF7"/>
      <stop offset="1" stop-color="#ECFEFF"/>
    </linearGradient>
    <linearGradient id="brand" x1="180" y1="170" x2="1460" y2="880" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F97316"/>
      <stop offset="0.45" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="darkCard" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
    <filter id="panelShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <style>
      .eyebrow { font: 700 16px 'Segoe UI', Arial, sans-serif; letter-spacing: 0.2em; text-transform: uppercase; fill: #F97316; }
      .title { font: 800 50px 'Segoe UI', Arial, sans-serif; fill: #0F172A; }
      .subtitle { font: 500 22px 'Segoe UI', Arial, sans-serif; fill: #475569; }
      .panelTitle { font: 700 26px 'Segoe UI', Arial, sans-serif; fill: #0F172A; }
      .panelTitleLight { font: 700 26px 'Segoe UI', Arial, sans-serif; fill: #FFFFFF; }
      .copy { font: 500 17px 'Segoe UI', Arial, sans-serif; fill: #64748B; }
      .copyLight { font: 500 17px 'Segoe UI', Arial, sans-serif; fill: #CBD5E1; }
      .step { font: 700 20px 'Segoe UI', Arial, sans-serif; fill: #0F172A; }
      .small { font: 500 15px 'Segoe UI', Arial, sans-serif; fill: #64748B; }
      .smallLight { font: 500 15px 'Segoe UI', Arial, sans-serif; fill: #CBD5E1; }
      .pill { font: 700 13px 'Segoe UI', Arial, sans-serif; letter-spacing: 0.06em; text-transform: uppercase; fill: #0F172A; }
      .footer { font: 700 22px 'Segoe UI', Arial, sans-serif; fill: #0F172A; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="url(#page)"/>
  <circle cx="170" cy="140" r="160" fill="#FDBA74" fill-opacity="0.18"/>
  <circle cx="1470" cy="150" r="170" fill="#67E8F9" fill-opacity="0.18"/>
  <circle cx="1440" cy="860" r="210" fill="#FDE68A" fill-opacity="0.14"/>

  <rect x="70" y="58" width="1460" height="150" rx="34" fill="#FFFFFF" fill-opacity="0.72" filter="url(#softShadow)"/>
  <rect x="102" y="94" width="164" height="40" rx="20" fill="#FFF7ED"/>
  <circle cx="128" cy="114" r="12" fill="url(#brand)"/>
  <text x="150" y="121" class="eyebrow">GasFueler</text>
  <text x="102" y="170" class="title">Stakeholder Architecture</text>
  <text x="102" y="202" class="subtitle">A customer booking product built around partner stations, real-world discovery, and a clean service layer.</text>

  <g filter="url(#panelShadow)">
    <rect x="90" y="260" width="400" height="300" rx="34" fill="#FFFFFF"/>
    <rect x="120" y="290" width="82" height="82" rx="26" fill="#FFF7ED"/>
    <rect x="141" y="306" width="40" height="58" rx="10" fill="#F97316"/>
    <rect x="147" y="313" width="28" height="36" rx="5" fill="#FFFFFF" fill-opacity="0.94"/>
    <circle cx="161" cy="355" r="3" fill="#F97316"/>
    <text x="225" y="320" class="panelTitle">Customer Experience</text>
    <text x="225" y="350" class="copy">What drivers see and use first.</text>

    <rect x="122" y="404" width="336" height="44" rx="20" fill="#F8FAFC"/>
    <text x="146" y="432" class="step">Home page with pricing and booking CTA</text>
    <rect x="122" y="462" width="336" height="44" rx="20" fill="#F8FAFC"/>
    <text x="146" y="490" class="step">Sign in and account setup</text>
    <rect x="122" y="520" width="336" height="44" rx="20" fill="#F8FAFC"/>
    <text x="146" y="548" class="step">Book fueling workflow</text>
  </g>

  <g filter="url(#panelShadow)">
    <rect x="520" y="240" width="520" height="580" rx="40" fill="#FFFFFF"/>
    <rect x="560" y="278" width="170" height="36" rx="18" fill="#FFF7ED"/>
    <text x="587" y="301" class="pill">Core Workflow</text>
    <text x="560" y="356" class="panelTitle">GasFueler Booking Engine</text>
    <text x="560" y="389" class="copy">The service model is intentionally operational: choose a partner station, choose a real slot, then save a structured fuel request.</text>

    <rect x="560" y="445" width="420" height="62" rx="24" fill="#FFF7ED"/>
    <circle cx="596" cy="476" r="18" fill="#F97316"/>
    <text x="590" y="482" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF">1</text>
    <text x="628" y="483" class="step">Choose a station</text>

    <rect x="560" y="523" width="420" height="62" rx="24" fill="#FFF7ED"/>
    <circle cx="596" cy="554" r="18" fill="#F59E0B"/>
    <text x="590" y="560" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF">2</text>
    <text x="628" y="561" class="step">Pick a live service slot</text>

    <rect x="560" y="601" width="420" height="62" rx="24" fill="#FFF7ED"/>
    <circle cx="596" cy="632" r="18" fill="#06B6D4"/>
    <text x="590" y="638" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF">3</text>
    <text x="628" y="639" class="step">Enter fuel and vehicle details</text>

    <rect x="560" y="679" width="420" height="62" rx="24" fill="#FFF7ED"/>
    <circle cx="596" cy="710" r="18" fill="#0F172A"/>
    <text x="590" y="716" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF">4</text>
    <text x="628" y="717" class="step">Save a fuel request to the platform</text>

    <path d="M1015 413V753" stroke="url(#brand)" stroke-width="5" stroke-linecap="round" stroke-dasharray="10 14"/>
  </g>

  <g filter="url(#panelShadow)">
    <rect x="1080" y="248" width="430" height="250" rx="34" fill="url(#darkCard)"/>
    <text x="1118" y="308" class="panelTitleLight">Partner Station Layer</text>
    <text x="1118" y="338" class="copyLight">These locations live inside the GasFueler platform and can be booked immediately.</text>
    <rect x="1118" y="378" width="148" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.1"/>
    <text x="1148" y="401" class="pill" fill="#FFFFFF">Bookable now</text>
    <rect x="1118" y="432" width="354" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.08"/>
    <text x="1140" y="455" class="smallLight">Stored in Supabase with service slots and capacity</text>
  </g>

  <g filter="url(#panelShadow)">
    <rect x="1080" y="528" width="430" height="292" rx="34" fill="#FFFFFF"/>
    <rect x="1118" y="564" width="186" height="36" rx="18" fill="#ECFEFF"/>
    <text x="1146" y="587" class="pill">Discovery layer</text>
    <text x="1118" y="645" class="panelTitle">Nearby Gas Stations</text>
    <text x="1118" y="677" class="copy">Google Places returns real nearby stations so the app feels location-aware, even before every station becomes a full partner.</text>

    <rect x="1118" y="716" width="354" height="40" rx="20" fill="#F8FAFC"/>
    <text x="1142" y="742" class="small">Discovery only today, not direct booking</text>
    <rect x="1118" y="768" width="354" height="40" rx="20" fill="#F8FAFC"/>
    <text x="1142" y="794" class="small">Can populate selected station display</text>
  </g>

  <g filter="url(#panelShadow)">
    <rect x="100" y="610" width="360" height="250" rx="34" fill="#FFFFFF"/>
    <text x="138" y="672" class="panelTitle">Business Rules</text>
    <rect x="138" y="710" width="284" height="42" rx="21" fill="#F8FAFC"/>
    <text x="160" y="737" class="small">Partner stations are shown first</text>
    <rect x="138" y="764" width="284" height="42" rx="21" fill="#FFF7ED"/>
    <text x="160" y="791" class="small">Google stations are shown second</text>
    <rect x="138" y="818" width="284" height="42" rx="21" fill="#ECFEFF"/>
    <text x="160" y="845" class="small">Discovery and booking stay separate</text>
  </g>

  <g filter="url(#panelShadow)">
    <rect x="500" y="850" width="1010" height="104" rx="30" fill="#FFFFFF"/>
    <text x="536" y="896" class="footer">Platform Stack</text>
    <rect x="720" y="872" width="152" height="42" rx="21" fill="#F8FAFC"/>
    <text x="764" y="899" class="small">Supabase</text>
    <rect x="892" y="872" width="126" height="42" rx="21" fill="#FFF7ED"/>
    <text x="933" y="899" class="small">Vercel</text>
    <rect x="1038" y="872" width="122" height="42" rx="21" fill="#FEF2F2"/>
    <text x="1078" y="899" class="small">Stripe</text>
    <rect x="1180" y="872" width="188" height="42" rx="21" fill="#ECFEFF"/>
    <text x="1217" y="899" class="small">Google Places API</text>
  </g>

  <path d="M492 410H520" stroke="#94A3B8" stroke-width="6" stroke-linecap="round"/>
  <path d="M1040 365H1072" stroke="#94A3B8" stroke-width="6" stroke-linecap="round"/>
  <path d="M1040 655H1072" stroke="#94A3B8" stroke-width="6" stroke-linecap="round"/>
  <path d="M460 736H500" stroke="#94A3B8" stroke-width="6" stroke-linecap="round" stroke-dasharray="8 14"/>

  <polygon points="512,400 532,410 512,420" fill="#94A3B8"/>
  <polygon points="1062,355 1082,365 1062,375" fill="#94A3B8"/>
  <polygon points="1062,645 1082,655 1062,665" fill="#94A3B8"/>
  <polygon points="490,726 510,736 490,746" fill="#94A3B8"/>
</svg>
