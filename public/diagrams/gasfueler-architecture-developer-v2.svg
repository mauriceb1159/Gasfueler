<svg width="1600" height="1000" viewBox="0 0 1600 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="1000" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#EFF6FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <style>
      .eyebrow { font: 700 16px 'Segoe UI', Arial, sans-serif; letter-spacing: 0.16em; text-transform: uppercase; fill: #2563EB; }
      .title { font: 800 46px 'Segoe UI', Arial, sans-serif; fill: #0F172A; }
      .subtitle { font: 500 21px 'Segoe UI', Arial, sans-serif; fill: #475569; }
      .section { font: 700 26px 'Segoe UI', Arial, sans-serif; fill: #0F172A; }
      .label { font: 700 19px 'Segoe UI', Arial, sans-serif; fill: #0F172A; }
      .copy { font: 500 16px 'Segoe UI', Arial, sans-serif; fill: #64748B; }
      .mono { font: 600 15px Consolas, 'Courier New', monospace; fill: #0F172A; }
      .pill { font: 700 12px 'Segoe UI', Arial, sans-serif; letter-spacing: 0.08em; text-transform: uppercase; fill: #1E293B; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <circle cx="180" cy="120" r="130" fill="#BFDBFE" fill-opacity="0.35"/>
  <circle cx="1450" cy="140" r="150" fill="#E0F2FE" fill-opacity="0.7"/>

  <rect x="70" y="56" width="1460" height="130" rx="30" fill="#FFFFFF" filter="url(#shadow)"/>
  <text x="104" y="100" class="eyebrow">GasFueler Developer Diagram v2</text>
  <text x="104" y="148" class="title">Cleaner Engineering Overview</text>
  <text x="104" y="180" class="subtitle">The core request path in the center, with supporting services and storage around it.</text>

  <g filter="url(#shadow)">
    <rect x="120" y="270" width="260" height="520" rx="30" fill="#FFFFFF"/>
    <rect x="146" y="296" width="96" height="28" rx="14" fill="#DBEAFE"/>
    <text x="168" y="315" class="pill">Frontend</text>
    <text x="146" y="364" class="section">Routes</text>
    <rect x="146" y="398" width="208" height="46" rx="18" fill="#F8FAFC"/>
    <text x="165" y="427" class="mono">/</text>
    <rect x="146" y="458" width="208" height="46" rx="18" fill="#F8FAFC"/>
    <text x="165" y="487" class="mono">/pricing</text>
    <rect x="146" y="518" width="208" height="46" rx="18" fill="#F8FAFC"/>
    <text x="165" y="547" class="mono">/contact</text>
    <rect x="146" y="578" width="208" height="46" rx="18" fill="#F8FAFC"/>
    <text x="165" y="607" class="mono">/dashboard</text>
    <rect x="146" y="638" width="208" height="46" rx="18" fill="#EFF6FF"/>
    <text x="165" y="667" class="mono">/book</text>
    <text x="146" y="726" class="copy">Main UI files:</text>
    <text x="146" y="756" class="mono">app/(dashboard)/book/page.tsx</text>
    <text x="146" y="782" class="mono">app/(dashboard)/book/booking-form.tsx</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="450" y="230" width="700" height="610" rx="34" fill="#FFFFFF"/>
    <rect x="486" y="262" width="188" height="30" rx="15" fill="#E0F2FE"/>
    <text x="520" y="282" class="pill">Primary Flow</text>
    <text x="486" y="340" class="section">Booking Request Lifecycle</text>
    <text x="486" y="372" class="copy">This is the central path the app executes when a user books fueling.</text>

    <rect x="486" y="426" width="628" height="74" rx="24" fill="#EFF6FF"/>
    <text x="518" y="455" class="label">1. Client form</text>
    <text x="518" y="482" class="mono">booking-form.tsx</text>
    <text x="760" y="482" class="copy">Location, partner stations, Google station discovery, vehicle fields</text>

    <path d="M800 508V546" stroke="#94A3B8" stroke-width="5" stroke-linecap="round" stroke-dasharray="8 10"/>

    <rect x="486" y="560" width="628" height="74" rx="24" fill="#FFF7ED"/>
    <text x="518" y="589" class="label">2. Server validation</text>
    <text x="518" y="616" class="mono">actions.ts</text>
    <text x="760" y="616" class="copy">Validates station, slot, vehicle, request type, and special instructions</text>

    <path d="M800 642V680" stroke="#94A3B8" stroke-width="5" stroke-linecap="round" stroke-dasharray="8 10"/>

    <rect x="486" y="694" width="628" height="74" rx="24" fill="#F0FDF4"/>
    <text x="518" y="723" class="label">3. Database write</text>
    <text x="518" y="750" class="mono">fuel_requests + vehicles + service_slots</text>
    <text x="860" y="750" class="copy">Stored in Supabase Postgres</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1190" y="270" width="290" height="250" rx="30" fill="#FFFFFF"/>
    <rect x="1216" y="296" width="120" height="28" rx="14" fill="#E0F2FE"/>
    <text x="1242" y="315" class="pill">API Route</text>
    <text x="1216" y="364" class="section">Discovery</text>
    <text x="1216" y="396" class="mono">/api/places/nearby-gas-stations</text>
    <text x="1216" y="432" class="copy">Calls Google Places API (New)</text>
    <text x="1216" y="462" class="copy">Returns nearby stations for discovery only</text>
    <rect x="1216" y="484" width="172" height="32" rx="16" fill="#FEF3C7"/>
    <text x="1238" y="505" class="pill">GOOGLE_MAPS_API_KEY</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1190" y="550" width="290" height="290" rx="30" fill="#0F172A"/>
    <rect x="1216" y="576" width="108" height="28" rx="14" fill="#1D4ED8"/>
    <text x="1242" y="595" class="pill" fill="#DBEAFE">Storage</text>
    <text x="1216" y="644" class="section" fill="#FFFFFF">Supabase</text>
    <text x="1216" y="678" class="copy" fill="#CBD5E1">Core tables</text>
    <text x="1216" y="708" class="mono" fill="#E2E8F0">users / teams</text>
    <text x="1216" y="736" class="mono" fill="#E2E8F0">stations / service_slots</text>
    <text x="1216" y="764" class="mono" fill="#E2E8F0">vehicles / fuel_requests</text>
    <text x="1216" y="804" class="copy" fill="#CBD5E1">Schema + migrations</text>
    <text x="1216" y="832" class="mono" fill="#FFFFFF">lib/db/schema.ts</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="450" y="872" width="1030" height="78" rx="26" fill="#FFFFFF"/>
    <text x="486" y="922" class="label">Key rule: Google Places = discovery. Supabase partner stations + slots = booking.</text>
  </g>

  <path d="M382 648H450" stroke="#94A3B8" stroke-width="6" stroke-linecap="round"/>
  <path d="M1150 392H1190" stroke="#94A3B8" stroke-width="6" stroke-linecap="round"/>
  <path d="M1150 724H1190" stroke="#94A3B8" stroke-width="6" stroke-linecap="round"/>
  <polygon points="440,638 460,648 440,658" fill="#94A3B8"/>
  <polygon points="1180,382 1200,392 1180,402" fill="#94A3B8"/>
  <polygon points="1180,714 1200,724 1180,734" fill="#94A3B8"/>
</svg>
