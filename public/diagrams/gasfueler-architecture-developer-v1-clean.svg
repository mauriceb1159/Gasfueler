<svg width="1600" height="1240" viewBox="0 0 1600 1240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="1120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#EFF6FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
    <style>
      .eyebrow { font: 700 16px 'Segoe UI', Arial, sans-serif; letter-spacing: 0.16em; text-transform: uppercase; fill: #2563EB; }
      .title { font: 800 44px 'Segoe UI', Arial, sans-serif; fill: #0F172A; }
      .subtitle { font: 500 20px 'Segoe UI', Arial, sans-serif; fill: #475569; }
      .subtitleSmall { font: 500 18px 'Segoe UI', Arial, sans-serif; fill: #475569; }
      .section { font: 700 24px 'Segoe UI', Arial, sans-serif; fill: #0F172A; }
      .label { font: 700 18px 'Segoe UI', Arial, sans-serif; fill: #0F172A; }
      .copy { font: 500 14px 'Segoe UI', Arial, sans-serif; fill: #475569; }
      .copyDark { font: 500 14px 'Segoe UI', Arial, sans-serif; fill: #CBD5E1; }
      .mono { font: 600 13px Consolas, 'Courier New', monospace; fill: #0F172A; }
      .monoLight { font: 600 13px Consolas, 'Courier New', monospace; fill: #FFFFFF; }
      .pill { font: 700 12px 'Segoe UI', Arial, sans-serif; letter-spacing: 0.08em; text-transform: uppercase; fill: #1E293B; }
    </style>
  </defs>

  <rect width="1600" height="1240" fill="url(#bg)"/>
  <rect x="60" y="52" width="1480" height="128" rx="28" fill="#FFFFFF" filter="url(#shadow)"/>
  <text x="96" y="98" class="eyebrow">GasFueler Developer Diagram</text>
  <text x="96" y="146" class="title">Current Application Architecture</text>
  <text x="96" y="176" class="subtitle">Next.js App Router on Vercel, Supabase-backed booking data, Stripe billing, and Google Places discovery.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="230" width="320" height="290" rx="28" fill="#FFFFFF"/>
    <rect x="94" y="254" width="122" height="30" rx="15" fill="#DBEAFE"/>
    <text x="117" y="274" class="pill">Frontend</text>
    <text x="94" y="322" class="section">App Router UI</text>
    <text x="94" y="352" class="copy">Public marketing pages, auth screens,</text>
    <text x="94" y="372" class="copy">dashboard views, and the booking flow.</text>

    <rect x="94" y="394" width="272" height="42" rx="18" fill="#F8FAFC"/>
    <text x="110" y="420" class="mono">app/(dashboard)/gasfueler-home-page.tsx</text>
    <rect x="94" y="448" width="272" height="42" rx="18" fill="#F8FAFC"/>
    <text x="110" y="474" class="mono">app/(dashboard)/pricing/page.tsx</text>
    <rect x="94" y="502" width="272" height="42" rx="18" fill="#F8FAFC"/>
    <text x="110" y="528" class="mono">app/(dashboard)/book/page.tsx</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="430" y="210" width="540" height="650" rx="32" fill="#FFFFFF"/>
    <rect x="458" y="238" width="170" height="30" rx="15" fill="#E0F2FE"/>
    <text x="492" y="258" class="pill">Core Request Flow</text>
    <text x="458" y="316" class="section">Booking Page + Server Action</text>
    <text x="458" y="346" class="copy">The book flow starts in a client form, validates input</text>
    <text x="458" y="366" class="copy">with a server action, and writes the request into Postgres.</text>

    <rect x="458" y="390" width="484" height="84" rx="22" fill="#EFF6FF"/>
    <text x="484" y="418" class="label">Client</text>
    <text x="484" y="442" class="mono">app/(dashboard)/book/booking-form.tsx</text>
    <text x="484" y="464" class="copy">Location prompt, partner-station sorting, Google station</text>
    <text x="484" y="484" class="copy">discovery, and selected-station UX.</text>

    <path d="M700 490V526" stroke="#94A3B8" stroke-width="5" stroke-linecap="round" stroke-dasharray="8 10"/>

    <rect x="458" y="538" width="484" height="84" rx="22" fill="#FFF7ED"/>
    <text x="484" y="566" class="label">Server Action</text>
    <text x="484" y="590" class="mono">app/(dashboard)/book/actions.ts</text>
    <text x="484" y="612" class="copy">Validates station, slot, vehicle, and request type,</text>
    <text x="484" y="632" class="copy">then inserts the fuel request.</text>

    <path d="M700 638V674" stroke="#94A3B8" stroke-width="5" stroke-linecap="round" stroke-dasharray="8 10"/>

    <rect x="458" y="686" width="484" height="84" rx="22" fill="#F0FDF4"/>
    <text x="484" y="714" class="label">Database Access</text>
    <text x="484" y="738" class="mono">lib/db/queries.ts + lib/db/drizzle.ts</text>
    <text x="484" y="760" class="copy">Reads bookable stations and vehicles, then writes</text>
    <text x="484" y="780" class="copy">fuel requests into Supabase Postgres.</text>

    <rect x="458" y="790" width="230" height="48" rx="20" fill="#F8FAFC"/>
    <text x="481" y="819" class="mono">getBookableStations()</text>
    <rect x="712" y="790" width="230" height="48" rx="20" fill="#F8FAFC"/>
    <text x="739" y="819" class="mono">getVehiclesForUser()</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1010" y="230" width="520" height="286" rx="28" fill="#FFFFFF"/>
    <rect x="1036" y="254" width="154" height="30" rx="15" fill="#E0F2FE"/>
    <text x="1066" y="274" class="pill">API Route</text>
    <text x="1036" y="322" class="section">Nearby Station Discovery</text>
    <text x="1036" y="352" class="copy">A server route calls Google Places API (New)</text>
    <text x="1036" y="372" class="copy">and returns nearby gas stations to the booking form.</text>

    <rect x="1036" y="392" width="468" height="46" rx="18" fill="#F8FAFC"/>
    <text x="1058" y="421" class="mono">app/api/places/nearby-gas-stations/route.ts</text>

    <rect x="1036" y="452" width="220" height="42" rx="18" fill="#FEF3C7"/>
    <text x="1074" y="478" class="copy">Env: GOOGLE_MAPS_API_KEY</text>
    <rect x="1276" y="452" width="228" height="42" rx="18" fill="#ECFEFF"/>
    <text x="1300" y="478" class="copy">External service: Google Places</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1010" y="548" width="520" height="312" rx="28" fill="#0F172A"/>
    <rect x="1036" y="572" width="156" height="30" rx="15" fill="#1E3A8A"/>
    <text x="1068" y="592" class="pill" fill="#DBEAFE">Persistence</text>
    <text x="1036" y="640" class="section" fill="#FFFFFF">Supabase Postgres Schema</text>
    <text x="1036" y="668" class="copyDark">Auth, team management, contact inquiries,</text>
    <text x="1036" y="688" class="copyDark">and booking entities all live here.</text>

    <rect x="1036" y="710" width="220" height="40" rx="18" fill="#1E293B"/>
    <text x="1060" y="736" class="monoLight">users / teams / team_members</text>
    <rect x="1280" y="710" width="224" height="40" rx="18" fill="#1E293B"/>
    <text x="1304" y="736" class="monoLight">contact_inquiries</text>
    <rect x="1036" y="764" width="220" height="40" rx="18" fill="#1E293B"/>
    <text x="1060" y="790" class="monoLight">stations / service_slots</text>
    <rect x="1280" y="764" width="224" height="40" rx="18" fill="#1E293B"/>
    <text x="1304" y="790" class="monoLight">vehicles / fuel_requests</text>

    <text x="1036" y="834" class="copyDark">Schema:</text>
    <text x="1096" y="834" class="monoLight">lib/db/schema.ts</text>
    <text x="1036" y="860" class="copyDark">Migrations:</text>
    <text x="1118" y="860" class="monoLight">0001_contact_inquiries.sql</text>
    <text x="1118" y="882" class="monoLight">0002_fuel_requests.sql</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="70" y="560" width="320" height="300" rx="28" fill="#FFFFFF"/>
    <rect x="94" y="586" width="126" height="30" rx="15" fill="#FCE7F3"/>
    <text x="124" y="606" class="pill">Billing + Auth</text>
    <text x="94" y="654" class="section">Supporting Systems</text>
    <text x="94" y="684" class="copy">Authentication uses cookie sessions.</text>
    <text x="94" y="704" class="copy">Billing still flows through Stripe routes.</text>

    <rect x="94" y="730" width="272" height="42" rx="18" fill="#F8FAFC"/>
    <text x="112" y="756" class="mono">app/(login)/actions.ts</text>
    <rect x="94" y="784" width="272" height="42" rx="18" fill="#F8FAFC"/>
    <text x="112" y="810" class="mono">app/api/stripe/checkout/route.ts</text>
    <rect x="94" y="838" width="272" height="42" rx="18" fill="#F8FAFC"/>
    <text x="112" y="864" class="mono">app/api/stripe/webhook/route.ts</text>
  </g>

  <path d="M392 376H430" stroke="#94A3B8" stroke-width="6" stroke-linecap="round"/>
  <path d="M970 394H1010" stroke="#94A3B8" stroke-width="6" stroke-linecap="round"/>
  <path d="M970 720H1010" stroke="#94A3B8" stroke-width="6" stroke-linecap="round"/>
  <path d="M392 708H430" stroke="#94A3B8" stroke-width="6" stroke-linecap="round"/>
  <path d="M1230 516V548" stroke="#94A3B8" stroke-width="6" stroke-linecap="round"/>

  <polygon points="422,366 442,376 422,386" fill="#94A3B8"/>
  <polygon points="1000,384 1020,394 1000,404" fill="#94A3B8"/>
  <polygon points="1000,710 1020,720 1000,730" fill="#94A3B8"/>
  <polygon points="422,698 442,708 422,718" fill="#94A3B8"/>

  <rect x="430" y="930" width="1100" height="170" rx="28" fill="#FFFFFF" filter="url(#shadow)"/>
  <text x="466" y="978" class="section">Key Engineering Rule</text>
  <text x="466" y="1018" class="subtitleSmall">Google Places is a discovery layer. Supabase partner stations plus service slots are the actual</text>
  <text x="466" y="1048" class="subtitleSmall">booking layer. The product keeps those concerns separate on purpose.</text>
</svg>
